name: Build bot binary
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build -tags netgo -ldflags '-s -w' -o bot ./cmd/bot
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: bot-latest
          files: bot