name: Keep-alive 24/7

on:
  schedule:
    # Cada 5 minutos, desplazado 2 min para evitar los minutos
    # mas saturados de GitHub Actions (menos retraso).
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al backend en Render
        env:
          BACKEND_URL: https://hot-coffee-backend.onrender.com
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$BACKEND_URL/api/tournaments/count")
          echo "GET /api/tournaments/count -> HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "WARN: la API no respondio bien, reintentando con la raiz..."
            curl -s -o /dev/null -w 'GET / -> HTTP %{http_code}\n' --max-time 120 "$BACKEND_URL/"
          fi